name: Clean metadata files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clean-metadata.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove macOS metadata files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '._*' -delete
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m Remove-macOS-metadata-files || exit 0
          git push
